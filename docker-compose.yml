services:
  mysql:
    image: mysql:8.4
    container_name: frontyre-mysql-dev
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: frontyre_dev_root
      MYSQL_DATABASE: frontyre_dev
      MYSQL_USER: frontyre
      MYSQL_PASSWORD: frontyre_dev_pass
    volumes:
      - frontyre_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ufrontyre", "-pfrontyre_dev_pass"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  frontyre_mysql_data:
